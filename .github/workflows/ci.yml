name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client isn't committed (it's generated), so generate it
      # before the build. `generate` reads the schema, not a live database.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      # Unit tests on the pure logic in src/lib. They need no database and no
      # secrets, so they run before the build and fail fast.
      - name: Test
        run: npm test

      # `next build` type-checks and compiles. The env values below are
      # build-time placeholders, not real secrets: the build constructs clients
      # (Prisma adapter, Auth.js) at module load but never connects to a DB or
      # authenticates, so any well-formed value works here.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          NEXT_PUBLIC_APP_URL: http://localhost:3000
